<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Notch Qatar Perfumes Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rose: { 900: '#5B1E31', 950: '#4A1525' },
                        rosegold: { 300: '#F3C9BC', 400: '#E5A995', 500: '#D49B85', 600: '#B86B7D' },
                        blush: { 50: '#FFF5F6', 100: '#FDF0F2' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-rose-950 text-stone-900 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl border border-rosegold-500/30 overflow-hidden">
        <!-- HEADER BAND -->
        <div class="glass-header-rose text-white p-8 text-center space-y-2 border-b border-rosegold-500/20">
            <img src="image/notch-logo-white.png" alt="NOTCH Admin" class="h-8 mx-auto object-contain mb-2" />
            <h2 class="font-serif-heading text-2xl font-bold tracking-wide">Admin Portal Sign In</h2>
            <p class="text-xs text-rosegold-300">Authorized personnel access only</p>
        </div>

        <!-- FORM CONTAINER -->
        <div class="p-8 space-y-6">
            <div id="error-message" class="hidden bg-red-50 text-red-700 border border-red-200 text-xs font-bold p-3 rounded-xl text-center">
                Invalid Admin credentials! Please try again.
            </div>

            <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-rose-950 mb-1">Admin Email Address *</label>
                    <input type="email" id="admin-email" required placeholder="admin@gmail.com" class="w-full bg-stone-50 border border-stone-200 p-3 rounded-xl focus:outline-none focus:border-rose-950 text-xs" />
                </div>

                <div>
                    <label class="block font-bold text-rose-950 mb-1">Password *</label>
                    <input type="password" id="admin-pass" required placeholder="••••••••" class="w-full bg-stone-50 border border-stone-200 p-3 rounded-xl focus:outline-none focus:border-rose-950 text-xs" />
                </div>

                <button type="submit" class="w-full py-3.5 rose-gold-bg text-rose-950 font-bold text-xs uppercase tracking-widest rounded-xl transition-all shadow-md mt-2 hover:opacity-90">
                    🔑 Access Admin Master Dashboard
                </button>
            </form>

            <div class="pt-4 border-t border-stone-100 text-center">
                <a href="login.html" class="text-xs text-stone-500 hover:text-rose-950 font-bold underline">← Return to Customer Storefront Login</a>
            </div>
        </div>
    </div>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('admin-email');
            const passInput = document.getElementById('admin-pass');
            const email = emailInput.value.trim();
            const pass = passInput.value.trim();
            const errorDiv = document.getElementById('error-message');

            if (email === 'admin@gmail.com' && pass === '123') {
                errorDiv.classList.add('hidden');
                localStorage.setItem('adminLoggedIn', 'true');
                document.getElementById('admin-login-form').reset();
                emailInput.value = '';
                passInput.value = '';
                window.location.href = 'admin-dashboard.html';
            } else {
                errorDiv.textContent = 'Invalid Admin email or password! Please check credentials.';
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
